<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Crazy Zizo — Star Dash</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;font-family:Arial,sans-serif;background:#071a38;color:#fff;overflow:hidden}
body{display:flex;align-items:center;justify-content:center}
#app{position:relative;width:min(100vw,520px);height:min(100vh,900px);overflow:hidden;background:linear-gradient(#1598e8,#73d9ff 62%,#75c94b 62%,#4b9d35 100%)}
canvas{width:100%;height:100%;display:block}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
.hidden{display:none!important}
.logo{font-size:54px;font-weight:1000;line-height:.85;text-shadow:0 6px 0 #1b1b1b,0 9px 14px #00345d;letter-spacing:-2px;margin-bottom:22px}
.logo span{display:block;color:#ffb300}
.logo .c{color:#ff3c35}.logo .r{color:#ffc21a}.logo .a{color:#61d52e}.logo .z{color:#2aa8ff}.logo .y{color:#c86aff}
button{border:0;border-radius:20px;padding:15px 28px;font-size:23px;font-weight:900;color:#fff;cursor:pointer;box-shadow:0 6px 0 rgba(0,0,0,.25);margin:7px;min-width:210px}
#play{background:#45b81b} #help{background:#168ce1} #back{background:#ff8a00}
.card{background:rgba(255,255,255,.92);color:#123;padding:20px;border-radius:24px;max-width:420px;box-shadow:0 10px 30px #003b6670}
.card h2{margin:0 0 10px;color:#f28c00}
.card p{font-size:20px;line-height:1.5;margin:8px}
#gameover{background:rgba(3,18,44,.62)}
.score{font-size:58px;font-weight:1000;margin:4px}
.small{font-size:17px}
#hud{position:absolute;top:15px;left:15px;right:15px;display:flex;justify-content:space-between;align-items:center;z-index:4;pointer-events:none}
.badge{background:#092c56dd;border-radius:18px;padding:8px 14px;font-weight:900;font-size:22px;border:2px solid #ffffff55}
#pause{pointer-events:auto;min-width:auto;width:52px;height:52px;padding:0;margin:0;border-radius:50%;font-size:24px;background:#092c56dd}
#controls{position:absolute;bottom:18px;left:0;right:0;display:flex;justify-content:space-between;padding:0 22px;z-index:5}
.ctrl{width:82px;height:64px;border-radius:22px;background:#ffffff44;border:2px solid #fff8;font-size:34px;min-width:0;padding:0;margin:0;box-shadow:none;backdrop-filter:blur(5px)}
</style>
</head>
<body>
<div id="app">
<canvas id="game"></canvas>

<div id="menu" class="screen">
  <div class="logo"><span><i class="c">C</i><i class="r">R</i><i class="a">A</i><i class="z">Z</i><i class="y">Y</i></span><span>ZIZO ⭐</span></div>
  <button id="play">▶ PLAY</button>
  <button id="help">❓ إزاي نلعب؟</button>
  <div class="small">اللعب + تعلم + مرح 🎮</div>
</div>

<div id="helpScreen" class="screen hidden">
  <div class="card">
    <h2>🎮 إزاي نلعب؟</h2>
    <p>⭐ اجمع النجوم عشان تزود السكور.</p>
    <p>💣 ابعد عن القنابل والحجارة.</p>
    <p>⬅️➡️ حرّك زيزو يمين وشمال.</p>
    <p>كل ما تكمل، اللعبة تسرّع شوية!</p>
    <button id="back">🏠 رجوع</button>
  </div>
</div>

<div id="hud" class="hidden">
  <div class="badge">⭐ <span id="stars">0</span></div>
  <div class="badge">Score <span id="score">0</span></div>
  <button id="pause">Ⅱ</button>
</div>

<div id="controls" class="hidden">
  <button class="ctrl" id="left">⬅</button>
  <button class="ctrl" id="right">➡</button>
</div>

<div id="gameover" class="screen hidden">
  <div class="card">
    <h2>GAME OVER 😢</h2>
    <div class="score" id="finalScore">0</div>
    <div id="bestText">🏆 أحسن نتيجة: 0</div>
    <button id="again" style="background:#168ce1">🔄 TRY AGAIN</button>
    <button id="home" style="background:#ff8a00">🏠 HOME</button>
  </div>
</div>
</div>

let running=false,paused=false,score=0,stars=0,best=Number(localStorage.getItem('cz_best')||0);
let player,objects=[],spawn=0,last=0,speed=230,keys={left:false,right:false};

function reset(){
 score=0;stars=0;speed=230;objects=[];spawn=0;paused=false;
 player={x:W/2-48,y:H-190,w:96,h:136};
 document.getElementById('score').textContent=0;document.getElementById('stars').textContent=0;
}
function start(){
 reset();running=true;menu.classList.add('hidden');helpScreen.classList.add('hidden');
 gameover.classList.add('hidden');hud.classList.remove('hidden');controls.classList.remove('hidden');
 last=performance.now();requestAnimationFrame(loop);
}
function end(){
 running=false;gameover.classList.remove('hidden');hud.classList.add('hidden');controls.classList.add('hidden');
 document.getElementById('finalScore').textContent=score;
 if(score>best){best=score;localStorage.setItem('cz_best',best)}
 document.getElementById('bestText').textContent='🏆 أحسن نتيجة: '+best;
}
function spawnObj(){
 const isStar=Math.random()<.63,size=isStar?34:40;
 objects.push({x:35+Math.random()*(W-70),y:-50,r:size,type:isStar?'star':(Math.random()<.5?'bomb':'rock'),vy:speed*(.9+Math.random()*.45),rot:Math.random()*6.28});
}
function hit(a,b){return Math.abs((a.x+a.w/2)-b.x)<a.w*.42+b.r*.45&&Math.abs((a.y+a.h/2)-b.y)<a.h*.38+b.r*.5}
function drawBackground(){
 let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#1599ea');g.addColorStop(.65,'#79ddff');g.addColorStop(.651,'#7bd44d');g.addColorStop(1,'#4d9e36');
 ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 ctx.fillStyle='#ffffff55';
 for(let i=0;i<7;i++){let x=(i*97+80)%W,y=90+(i%3)*70;ctx.beginPath();ctx.arc(x,y,25,0,7);ctx.arc(x+28,y+3,32,0,7);ctx.arc(x+55,y,22,0,7);ctx.fill()}
 ctx.fillStyle='#65b53c';ctx.fillRect(0,H-105,W,105);ctx.fillStyle='#4d9a35';ctx.fillRect(0,H-82,W,82);
}
function drawStar(o){
 ctx.save();ctx.translate(o.x,o.y);ctx.rotate(o.rot);ctx.fillStyle='#ffd83d';ctx.strokeStyle='#ff9e00';ctx.lineWidth=4;ctx.beginPath();
 for(let i=0;i<10;i++){let r=i%2?o.r*.45:o.r,a=i*Math.PI/5;ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r)}
 ctx.closePath();ctx.fill();ctx.stroke();ctx.restore();
}
function drawBomb(o){
 ctx.save();ctx.translate(o.x,o.y);ctx.fillStyle='#171717';ctx.beginPath();ctx.arc(0,0,o.r*.7,0,7);ctx.fill();
 ctx.strokeStyle='#ffad19';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(0,-o.r*.6);ctx.lineTo(12,-o.r);ctx.stroke();
 ctx.fillStyle='#ffd43b';ctx.beginPath();ctx.arc(13,-o.r,5,0,7);ctx.fill();ctx.restore();
}
function drawRock(o){
 ctx.save();ctx.translate(o.x,o.y);ctx.rotate(o.rot);ctx.fillStyle='#777';ctx.beginPath();
 for(let i=0;i<8;i++){let a=i*Math.PI/4,r=o.r*(.72+Math.sin(i*5)*.15);ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r)}
 ctx.closePath();ctx.fill();ctx.strokeStyle='#555';ctx.lineWidth=3;ctx.stroke();ctx.restore();
}
function draw(){
 drawBackground();ctx.drawImage(zizo,player.x,player.y,player.w,player.h);
 objects.forEach(o=>o.type==='star'?drawStar(o):o.type==='bomb'?drawBomb(o):drawRock(o));
}
function loop(now){
 if(!running)return;requestAnimationFrame(loop);if(paused){draw();return}
 let dt=Math.min((now-last)/1000,.035);last=now;
 speed=Math.min(430,230+score*.9);
 player.vx=(keys.right?1:0)-(keys.left?1:0);player.x+=player.vx*360*dt;
 player.x=Math.max(8,Math.min(W-player.w-8,player.x));
 spawn-=dt;if(spawn<=0){spawn=Math.max(.22,.65-score/1500)+Math.random()*.35;spawnObj()}
 objects.forEach(o=>{o.y+=o.vy*dt;o.rot+=dt*2});
 for(let i=objects.length-1;i>=0;i--){
  const o=objects[i];
  if(hit(player,o)){
   if(o.type==='star'){stars++;score+=10;objects.splice(i,1);document.getElementById('stars').textContent=stars;document.getElementById('score').textContent=score}
   else{end();return}
  }else if(o.y>H+80){objects.splice(i,1);score++;document.getElementById('score').textContent=score}
 }
 draw();
}
function setKey(dir,on){keys[dir]=on}
['left','right'].forEach(id=>{
 const b=document.getElementById(id);
 b.addEventListener('pointerdown',e=>{e.preventDefault();setKey(id,true)});
 ['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,()=>setKey(id,false)));
});
addEventListener('keydown',e=>{if(e.key==='ArrowLeft')setKey('left',true);if(e.key==='ArrowRight')setKey('right',true);if(e.key===' '&&running)paused=!paused});
addEventListener('keyup',e=>{if(e.key==='ArrowLeft')setKey('left',false);if(e.key==='ArrowRight')setKey('right',false)});
document.getElementById('play').onclick=start;
document.getElementById('again').onclick=start;
document.getElementById('home').onclick=()=>{running=false;gameover.classList.add('hidden');menu.classList.remove('hidden')};
document.getElementById('help').onclick=()=>{menu.classList.add('hidden');helpScreen.classList.remove('hidden')};
document.getElementById('back').onclick=()=>{helpScreen.classList.add('hidden');menu.classList.remove('hidden')};
document.getElementById('pause').onclick=()=>{paused=!paused};
</script>

#tapStart{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:20;background:rgba(3,24,55,.18)}
#tapStart .go{background:#45b81b;color:#fff;border:0;border-radius:24px;padding:18px 34px;font-size:28px;font-weight:900;box-shadow:0 7px 0 #24750d}
</style>
<div id="tapStart"><button class="go">🎮 اضغط هنا للعب</button></div>

const ts=document.getElementById('tapStart');
ts.addEventListener('pointerdown',()=>{ts.style.display='none';document.getElementById('play').click()},{once:true});
</script>
